services:
  redis:
    image: redis:latest
    container_name: nimbus-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    command: >
      /bin/sh -c "redis-server --requirepass ${REDIS_PASSWORD}"

  postgres:
    image: postgres:latest
    container_name: nimbus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${NIMBUS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${NIMBUS_POSTGRES_PASSWORD}
      POSTGRES_DB: ${NIMBUS_POSTGRES_DB}
      NIMBUS_APP_DB_PASSWORD: ${NIMBUS_APP_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NIMBUS_POSTGRES_USER} -d ${NIMBUS_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  redis-data:
  postgres-data:
